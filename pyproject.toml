[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "WolfTg"
dynamic = ["version"]
requires-python = ">=3.12"
authors = [{ name = "Abdullah", email = "aldheeb01@gmail.com" }]
readme = "README.md"


dependencies = [
    "certifi", 
    "requests", 
    "pydantic>=2.0", 
    "aiohttp[speedups]", 
    "aldheeb-pytools[country,phone]", 

]


[project.urls]
"Homepage" = "https://github.com/eeeob/WolfTg"


[project.optional-dependencies]
dev = [
    "hatch<=1.16.5",
    "twine<=6.2.0",
]


[tool.hatch.build.targets.sdist]
exclude = [".github/"]

[tool.hatch.version]
path = "WolfTg/__meta__.py"


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = ["WolfTg"]
